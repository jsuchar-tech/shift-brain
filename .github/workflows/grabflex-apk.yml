name: Build GrabFlex APK
on:
  push:
    branches: [ temp-grabflex-apk-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grabflex-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GrabFlex-debug-apk
          path: grabflex-build/app/build/outputs/apk/debug/app-debug.apk
